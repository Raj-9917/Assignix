name: Supabase Keep-Alive & Health Check

on:
  schedule:
    # Run every 20 minutes (cron runs at :00, :20, :40 of every hour)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'Optional custom URL or function to ping'
        required: false
        default: ''

jobs:
  ping-supabase:
    name: Health Check Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve Environment Variables
        id: env-vars
        run: |
          # Check for secrets with either SUPABASE_URL or VITE_SUPABASE_URL naming
          URL="${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}"
          
          if [ -z "$URL" ]; then
            echo "❌ Error: SUPABASE_URL (or VITE_SUPABASE_URL) secret is not set in GitHub repository secrets!"
            echo "Please add SUPABASE_URL and SUPABASE_ANON_KEY to your GitHub Repo Settings -> Secrets & Variables -> Actions."
            exit 1
          fi
          
          echo "SUPABASE_URL=$URL" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$KEY" >> $GITHUB_ENV

      - name: Ping Supabase REST API (Database Keep-Alive)
        run: |
          echo "📡 Sending Keep-Alive Ping to Supabase Database..."
          START_TIME=$(date +%s%3N)
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTOTAL_TIME:%{time_total}s" \
            -X GET "${SUPABASE_URL}/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          TOTAL_TIME=$(echo "$RESPONSE" | grep "TOTAL_TIME:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:" | grep -v "TOTAL_TIME:")

          echo "⏱ Response Time: ${TOTAL_TIME}"
          echo "📊 HTTP Status: ${HTTP_STATUS}"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase REST API is awake and healthy! (Status: $HTTP_STATUS)"
          elif [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
            echo "⚠️ Auth required, but Supabase server responded (Status: $HTTP_STATUS). Server is awake!"
          else
            echo "ℹ️ Response Body: $BODY"
          fi

      - name: Ping Supabase Edge Function (if deployed)
        continue-on-error: true
        run: |
          echo "🚀 Checking Supabase Edge Function: health-check..."
          
          EDGE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${SUPABASE_URL}/functions/v1/health-check" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")

          EDGE_STATUS=$(echo "$EDGE_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          echo "📊 Edge Function Status: ${EDGE_STATUS}"

      - name: Summary
        run: |
          echo "### 🌟 Supabase Keep-Alive Health Check Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Active / Kept Awake" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Scheduled Run**: ~20 minutes" >> $GITHUB_STEP_SUMMARY
